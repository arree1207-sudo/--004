
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เข้าสู่ระบบ | เที่ยวบ้านเรา</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- เมนูด้านบน -->
<header class="main-header">
    <div class="logo">🌴 เที่ยวบ้านเรา</div>

    <nav>
        <ul>
            <li><a href="index.html">หน้าแรก</a></li>
            <li><a href="places.html">ที่เที่ยว</a></li>
            <li><a href="food.html">อาหาร</a></li>
            <li><a href="plan.html">วางแผนเที่ยว</a></li>
            <li><a href="travel.html">การเดินทาง</a></li>
            <li><a href="login.html" class="login-btn">เข้าสู่ระบบ</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="card">
        <h1>เข้าสู่ระบบ</h1>
        <p>ยินดีต้อนรับเข้าสู่เว็บไซต์เที่ยวบ้านเรา</p>

        <form onsubmit="login(event)">
            <label for="username">ชื่อผู้ใช้</label>
            <input type="text" id="username"
                   placeholder="กรอกชื่อผู้ใช้" required>

            <br><br>

            <label for="password">รหัสผ่าน</label>
            <input type="password" id="password"
                   placeholder="กรอกรหัสผ่าน" required>

            <br><br>

            <button type="submit">เข้าสู่ระบบ</button>

            <p id="message"></p>
        </form>

        <a href="index.html">กลับสู่หน้าหลัก</a>
    </section>
</main>

<footer>
    <p>เว็บไซต์เที่ยวบ้านเรา | เข้าสู่ระบบ</p>
</footer>

<script>
function login(event) {
    event.preventDefault();

    let username = document.getElementById("username").value;

    document.getElementById("message").innerText =
        "ยินดีต้อนรับคุณ " + username;
}
</script>

</body>
</html>
